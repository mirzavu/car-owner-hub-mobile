workflows:
  ios-workflow:
    name: iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true
          source: true
      # DISABLE automatic builds on every push to save minutes
      # You can trigger builds manually from Codemagic UI
      cancel_previous_builds: true
    
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    
    environment:
      groups:
        # Add your environment variables here (e.g. Apple API keys)
        - apple_auth 
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build iOS
        script: |
          # Use --no-codesign for initial builds if you haven't set up certificates in Codemagic yet
          # Remove --no-codesign once you've configured code signing in the Codemagic UI
          flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
