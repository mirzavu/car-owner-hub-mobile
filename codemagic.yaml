workflows:
  ios-workflow:
    name: iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Car Owners Hub
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true
          source: true
      cancel_previous_builds: true
    
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.carownershub.mobileApp

    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing in Xcode
        script: |
          xcode-project use-profiles
      - name: Get latest build number
        script: |
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "6762402739" || echo 0)
          echo "Latest build number: $LATEST_BUILD"
          echo "NEW_BUILD_NUMBER=$((LATEST_BUILD + 1))" >> $CM_ENV
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --build-number=$NEW_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
